<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ResearchHub{% endblock %}</title>
    <style>
        :root {
            --bg: #f3f7fb;
            --panel: #ffffff;
            --ink: #1c2a38;
            --muted: #5f7384;
            --primary: #153b75;
            --primary-soft: #dfeafc;
            --accent: #2b8a6b;
            --border: #dfe7ef;
            --shadow: 0 12px 30px rgba(15, 30, 52, 0.08);
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--ink);
        }
        a { color: var(--primary); text-decoration: none; }
        .container {
            width: min(1100px, calc(100% - 32px));
            margin: 0 auto;
        }
        .topbar {
            background: var(--primary);
            color: white;
            padding: 18px 0;
            box-shadow: var(--shadow);
        }
        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }
        .brand {
            font-size: 1.4rem;
            font-weight: 700;
        }
        .nav-links {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: white;
            opacity: 0.9;
        }
        .page {
            padding: 32px 0 50px;
        }
        .hero {
            background: linear-gradient(120deg, #102d53, #194d91);
            color: white;
            padding: 44px 24px;
            border-radius: 20px;
            box-shadow: var(--shadow);
        }
        .hero h1 {
            margin: 0 0 12px;
            font-size: clamp(2rem, 3vw, 3rem);
        }
        .hero p {
            margin: 0;
            color: rgba(255,255,255,0.8);
            max-width: 700px;
            line-height: 1.6;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin: 28px 0;
        }
        .stat {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px 18px;
            box-shadow: var(--shadow);
        }
        .stat .label {
            color: var(--muted);
            font-size: 0.8rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .stat .value {
            font-size: 2rem;
            font-weight: 700;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px;
            box-shadow: var(--shadow);
        }
        .card h3 {
            margin-top: 0;
        }
        .card ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .card li {
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            color: var(--ink);
        }
        .card li:last-child { border-bottom: none; }
        .btn {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 16px;
            background: var(--primary);
            color: white;
            border-radius: 10px;
            font-weight: 700;
        }
        .btn.secondary {
            background: var(--accent);
        }
        .btn.ghost {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.5);
            color: white;
        }
        .section-title {
            font-size: 2rem;
            margin-bottom: 18px;
        }
        .form-wrap {
            max-width: 700px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 26px;
            box-shadow: var(--shadow);
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
        }
        .form-control {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            font-size: 1rem;
        }
        textarea.form-control {
            min-height: 110px;
            resize: vertical;
        }
        .row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .badge {
            display: inline-block;
            background: var(--primary-soft);
            color: var(--primary);
            padding: 4px 8px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .muted {
            color: var(--muted);
        }
        .footer {
            background: #0f1f36;
            color: white;
            text-align: center;
            padding: 16px 12px;
            margin-top: 28px;
            font-size: 0.9rem;
        }
        @media (max-width: 700px) {
            .nav { display: block; }
            .nav-links { margin-top: 12px; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="container nav">
            <div class="brand">ResearchHub</div>
            <nav class="nav-links">
                <a href="{% url 'home' %}">Home</a>
                <a href="{% url 'project_list' %}">Projects</a>
                <a href="{% url 'paper_list' %}">Library</a>
                <a href="{% url 'project_create' %}">New Project</a>
                <a href="{% url 'paper_create' %}">Add Paper</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'users' %}">Users</a>
                <a href="{% url 'chat' %}">Chat</a>
                    <span style="color: white; opacity: 0.9;">{{ user.username }} • {{ user.profile.role|title }}</span>
                    <form method="post" action="{% url 'logout' %}" style="display: inline; margin: 0;">
                        {% csrf_token %}
                        <button type="submit" class="btn ghost" style="padding: 8px 12px; margin: 0; border: 1px solid rgba(255,255,255,0.5); cursor: pointer;">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="btn ghost">Login</a>
                    <a href="{% url 'signup' %}" class="btn ghost">Sign up</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="page">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="footer">
        © 2026 John Saviour
    </footer>
</body>
</html>
