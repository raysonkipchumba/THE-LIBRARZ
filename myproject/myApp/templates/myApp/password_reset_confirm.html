{% extends 'myApp/base.html' %}

{% block title %}Choose a new password{% endblock %}

{% block content %}
<h2 class="section-title">Choose a new password</h2>
<div class="form-wrap">
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group">
                {{ field.label_tag }}
                {{ field }}
                {% if field.errors %}
                    <div class="muted">{{ field.errors }}</div>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn">Save new password</button>
    </form>
</div>
{% endblock %}
